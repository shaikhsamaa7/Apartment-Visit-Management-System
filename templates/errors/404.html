{% extends "base.html" %}

{% block title %}404 Page Not Found{% endblock %}
{% block page_heading %}Resource Not Found (404){% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 40px auto; text-align: center;">
    <div class="card-body">
        <h2 style="font-size: 1.5rem; font-weight: 700; color: var(--text-main); margin-bottom: 10px;">Page Not Found</h2>
        <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 24px;">
            The page or record you requested does not exist or may have been removed.
        </p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Return to Dashboard</a>
    </div>
</div>
{% endblock %}
