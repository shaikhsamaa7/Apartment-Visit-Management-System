<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - AVMS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="background-color: #0f172a;">
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo-badge">AV</div>
                <h1 class="auth-title">Set New Password</h1>
                <p class="auth-subtitle">Create a secure replacement password</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="flash-container">
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}">
                                <span>{{ message }}</span>
                                <button type="button" class="alert-close">&times;</button>
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('auth.reset_password') }}" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <div class="form-group">
                    <label class="form-label" for="newpassword">New Password</label>
                    <input class="form-control" type="password" id="newpassword" name="newpassword" minlength="6" placeholder="At least 6 characters" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmpassword">Confirm New Password</label>
                    <input class="form-control" type="password" id="confirmpassword" name="confirmpassword" minlength="6" placeholder="Re-type new password" required>
                </div>

                <div style="margin-top: 24px;">
                    <button class="btn btn-primary" type="submit" style="width: 100%; justify-content: center; padding: 11px;">
                        <span>Update Password</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
