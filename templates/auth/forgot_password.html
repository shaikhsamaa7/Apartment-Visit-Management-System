<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Recovery - AVMS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="background-color: #0f172a;">
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo-badge">AV</div>
                <h1 class="auth-title">Password Recovery</h1>
                <p class="auth-subtitle">Verify your administrator credentials</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="flash-container">
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}">
                                <span>{{ message }}</span>
                                <button type="button" class="alert-close">&times;</button>
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('auth.forgot_password') }}" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <div class="form-group">
                    <label class="form-label" for="email">Registered Email Address</label>
                    <input class="form-control" type="email" id="email" name="email" placeholder="admin@gmail.com" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label" for="contactno">Registered Mobile Number</label>
                    <input class="form-control" type="text" id="contactno" name="contactno" placeholder="7898799797" required>
                </div>

                <div style="margin-top: 24px; display: flex; flex-direction: column; gap: 10px;">
                    <button class="btn btn-primary" type="submit" style="width: 100%; justify-content: center; padding: 11px;">
                        <span>Verify & Continue</span>
                    </button>
                    <a href="{{ url_for('auth.login') }}" class="btn btn-secondary" style="width: 100%; justify-content: center;">
                        <span>Back to Sign In</span>
                    </a>
                </div>
            </form>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
